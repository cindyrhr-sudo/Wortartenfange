<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wortarten-Profi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        
        html, body { 
            height: 100vh; 
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background: #0ea5e9;
            touch-action: none;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 95%;
            max-width: 1100px;
            height: 92vh;
            justify-content: center;
        }

        @media (min-aspect-ratio: 1/1) {
            .app-container { flex-direction: row; align-items: stretch; height: 85vh; }
            .menu-card { flex: 1; }
        }

        .menu-card {
            background: white;
            border-radius: 2.5rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            border-bottom: 8px solid #cbd5e1;
            overflow: hidden;
        }
        .shop-card { border-color: #fde047; }
        .start-card { border-color: #38bdf8; }

        .custom-scroll { overflow-y: auto; flex-grow: 1; padding-right: 5px; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        .word-card { 
            cursor: grab; 
            user-select: none; 
            box-shadow: 0 10px 0px #e2e8f0, 0 15px 20px rgba(0,0,0,0.1);
            border: 4px solid #f1f5f9;
            z-index: 50; 
            position: absolute;
            background: white;
            border-radius: 1.5rem;
            padding: 1rem 2rem;
            font-weight: 900;
            font-size: 1.25rem;
            color: #334155;
            white-space: nowrap;
        }
        
        .basket { 
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 30; 
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: inset 0 -8px 0 rgba(0,0,0,0.15);
        }
        .basket.drag-over { transform: scale(1.1) translateY(-10px); filter: brightness(1.15); }
        .basket.bounce { animation: bounce-anim 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .basket.shake { animation: shake-anim 0.5s linear; }

        @keyframes bounce-anim {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2) translateY(-20px); }
        }
        @keyframes shake-anim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .bg-collection {
            position: absolute;
            inset: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 2rem;
            pointer-events: none;
            opacity: 0.25;
            z-index: 1;
        }
        .bg-emoji { font-size: 4rem; animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-25px) rotate(5deg); }
        }

        .reward-mode { animation: rainbow-bg 4s infinite linear; }
        @keyframes rainbow-bg {
            0% { background-color: #e0f2fe; }
            50% { background-color: #fefce8; }
            100% { background-color: #e0f2fe; }
        }
        .star {
            position: absolute;
            font-size: 1.8rem;
            z-index: 100;
            cursor: pointer;
            filter: drop-shadow(0 0 5px gold);
            pointer-events: auto;
            opacity: 0.6;
            transition: transform 0.2s, opacity 0.2s;
        }
        
        .mode-btn { 
            padding: 0.5rem; 
            border-radius: 1rem; 
            border: 2px solid #e2e8f0; 
            font-weight: 700; 
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        .mode-btn.active { background: #0ea5e9; color: white; border-color: #0ea5e9; }

        .type-label-disabled {
            opacity: 0.35;
        }
    </style>
</head>
<body class="flex items-center justify-center select-none" id="body-main">

    <!-- START MENU -->
    <div id="start-menu" class="absolute inset-0 z-[200] bg-sky-500 flex items-center justify-center p-4">
        <div class="app-container">
            <div class="menu-card shop-card">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-black text-yellow-500">Emoji-Shop</h2>
                    <div class="bg-yellow-400 text-white px-4 py-1 rounded-full font-black shadow-sm">
                        <span id="total-coins">0</span> 🪙
                    </div>
                </div>
                <div class="custom-scroll grid grid-cols-4 sm:grid-cols-5 gap-3" id="shop-grid"></div>
                <p class="text-[10px] text-center text-slate-400 mt-4 font-bold uppercase tracking-tighter">Sammle Münzen für neue Hintergründe!</p>
            </div>

            <div class="menu-card start-card">
                <h1 class="text-2xl font-black text-sky-600 text-center mb-1">Wortarten-Profi</h1>
                
                <div class="custom-scroll space-y-4 py-2">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Geschwindigkeit</p>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="setSpeed('slow')" id="btn-slow" class="mode-btn active">Langsam</button>
                            <button onclick="setSpeed('medium')" id="btn-medium" class="mode-btn">Mittel</button>
                            <button onclick="setSpeed('fast')" id="btn-fast" class="mode-btn">Schnell</button>
                        </div>
                    </div>

                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Ziel</p>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="setGameGoal('words')" id="btn-words" class="mode-btn active">20 Wörter</button>
                            <button onclick="setGameGoal('time')" id="btn-time" class="mode-btn">1 Minute</button>
                        </div>
                    </div>

                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Kategorien</p>
                        <div id="filter-options" class="grid grid-cols-2 gap-2"></div>
                    </div>
                    
                    <button onclick="startGame()" class="w-full py-4 bg-green-500 hover:bg-green-600 text-white rounded-3xl text-xl font-black shadow-[0_6px_0_#16a34a] active:shadow-none active:translate-y-1 transition-all">
                        LOS GEHT'S!
                    </button>
                </div>

                <button onclick="toggleAdmin(true)" class="mt-2 text-slate-300 text-[10px] font-bold uppercase hover:text-sky-500">
                    ⚙️ Einstellungen
                </button>
            </div>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel" class="absolute inset-0 z-[300] hidden bg-slate-900/60 backdrop-blur-sm p-4 flex items-center justify-center">
        <div class="menu-card w-full max-w-2xl h-[90vh] !border-b-0">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-black">Wort-Editor</h2>
                <button onclick="toggleAdmin(false)" class="bg-sky-500 text-white px-6 py-2 rounded-xl font-bold">Fertig</button>
            </div>
            <div class="custom-scroll space-y-4">
                <div class="bg-amber-50 p-4 rounded-2xl border-2 border-amber-100">
                    <p class="text-[10px] font-bold text-amber-600 mb-1 uppercase">Import: Wort/Grundform/Typ (Pro Zeile eins)</p>
                    <textarea id="bulk-input" rows="3" class="w-full p-3 rounded-xl border text-sm" placeholder="Häuser/Haus/Nomen&#10;lief/laufen/Verb&#10;schöner/schön/Adjektiv"></textarea>
                    <button onclick="importBulkList()" class="mt-2 bg-amber-500 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase">Importieren</button>
                </div>
                <div class="bg-sky-50 p-4 rounded-2xl border-2 border-sky-100">
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input id="new-word" type="text" placeholder="Wort" class="p-2 rounded-lg border text-sm">
                        <input id="new-base" type="text" placeholder="Grundform" class="p-2 rounded-lg border text-sm">
                    </div>
                    <select id="new-type" class="w-full p-2 rounded-lg border text-sm mb-2 font-bold"></select>
                    <button onclick="addCustomWord()" class="w-full bg-sky-600 text-white py-2 rounded-xl font-bold">Hinzufügen</button>
                </div>
                <div class="border rounded-2xl overflow-hidden">
                    <table class="w-full text-xs text-left">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="p-3">Wort</th>
                                <th class="p-3">Grundform</th>
                                <th class="p-3">Typ</th>
                                <th class="p-3"></th>
                            </tr>
                        </thead>
                        <tbody id="word-list-table"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME -->
    <main id="game-container" class="relative h-screen w-screen hidden bg-sky-50 overflow-hidden">
        <div id="background-emojis" class="bg-collection"></div>
        
        <div class="absolute top-4 left-4 right-4 flex justify-between items-center z-[150]">
            <div class="flex gap-2">
                <div class="bg-white/90 px-4 py-2 rounded-2xl shadow font-black text-xs text-sky-600 border-b-4 border-sky-100">
                    <span id="counter-display">0</span> <span id="goal-label"></span>
                </div>
                <div class="bg-white/90 px-4 py-2 rounded-2xl shadow font-black text-yellow-600 text-xs border-b-4 border-yellow-100">🪙 <span id="game-coins-display">0</span></div>
            </div>
            <div id="combo-container" class="hidden bg-yellow-400 text-white px-5 py-2 rounded-full font-black text-xs animate-bounce shadow-xl border-2 border-white">COMBO x<span id="combo-count">0</span></div>
            <button onclick="goHome()" class="bg-white/90 w-10 h-10 rounded-full shadow flex items-center justify-center font-bold border-b-4 border-slate-200">🏠</button>
        </div>

        <div id="words-layer" class="absolute inset-0"></div>
        <!-- FIX: pointer-events-none entfernt, damit Sterne klickbar sind -->
        <div id="stars-layer" class="absolute inset-0"></div>
        <div id="baskets-container" class="absolute bottom-0 left-0 right-0 h-[22vh] flex justify-around items-end p-4 gap-3"></div>
    </main>

    <!-- FEEDBACK MODAL (falscher Korb) -->
    <div id="feedback-modal" class="absolute inset-0 z-[400] hidden flex items-center justify-center bg-sky-900/60 backdrop-blur-sm p-4">
        <div class="menu-card !border-red-400 max-w-sm w-full text-center p-8">
            <h2 class="text-2xl font-black text-red-500 mb-2">Fast!</h2>
            <p id="error-text" class="text-sm font-bold text-slate-500 mb-4"></p>
            <div class="bg-sky-50 p-6 rounded-[2.5rem] border-4 border-sky-100 mb-6">
                <span class="text-[10px] text-sky-400 font-black uppercase">Grundform</span>
                <p id="base-display" class="text-4xl font-black text-sky-800 uppercase"></p>
            </div>
            <button onclick="resumeGame()" class="w-full py-5 bg-sky-500 text-white rounded-3xl font-black shadow-[0_6px_0_#0369a1]">Weiter!</button>
        </div>
    </div>

    <!-- RESULT MODAL -->
    <div id="result-modal" class="absolute inset-0 z-[350] hidden flex items-center justify-center bg-sky-900/80 p-4">
        <div class="menu-card !border-yellow-400 max-w-sm w-full text-center p-12">
            <h2 class="text-4xl font-black text-sky-600 mb-4">Fertig!</h2>
            <div class="text-7xl font-black text-yellow-500 my-6">+<span id="session-coins">0</span> 🪙</div>
            <button onclick="goHome()" class="w-full py-5 bg-sky-500 text-white rounded-3xl font-black text-xl">Zum Shop</button>
        </div>
    </div>

    <script>
        // ─── Konstanten ───────────────────────────────────────────────────────────
        const wordTypes = ["Nomen", "Verb", "Adjektiv", "Pronomen", "Präposition"];
        const typeColors = {
            "Nomen":      "bg-red-500 border-red-600",
            "Verb":       "bg-blue-600 border-blue-700",
            "Adjektiv":   "bg-green-500 border-green-600",
            "Pronomen":   "bg-purple-500 border-purple-600",
            "Präposition":"bg-pink-500 border-pink-600"
        };
        const shopEmojis = ["🐶","🐱","🦁","🐼","🦄","🚀","🛸","🎮","⚽","🍦","🌈","REX","🦜","🐳","🍕","🏎️","🛹","🎸","💎","👾"];

        // ─── State ────────────────────────────────────────────────────────────────
        let totalCoins    = parseInt(localStorage.getItem('w_coins')) || 0;
        let boughtEmojis  = JSON.parse(localStorage.getItem('w_emojis')) || [];

        // FIX: Duplikate beim Laden entfernen
        let rawWords = JSON.parse(localStorage.getItem('w_words_v12')) || getDefaultWords();
        let customWords = deduplicateWords(rawWords);

        let speedMode   = 'slow';
        let gameGoal    = 'words';
        let timeLeft    = 60;
        let gameActive  = false, isPaused = false;
        let spawnTimer  = null, timerInterval = null, rewardTimer = null;
        let sessionCoins = 0, combo = 0, wordsSpawned = 0;
        let activeWords  = [], isRewardMode = false, selectedTypes = [];
        let curTouch     = null;

        // ─── Hilfsfunktionen ─────────────────────────────────────────────────────
        function deduplicateWords(arr) {
            return arr.filter((w, i, a) =>
                a.findIndex(x => x.word === w.word && x.type === w.type) === i
            );
        }

        // ─── Init ─────────────────────────────────────────────────────────────────
        function init() {
            renderShop();
            renderFilter();
            renderAdminTable();
            renderBackgroundEmojis();
            document.getElementById('total-coins').innerText = totalCoins;
            document.getElementById('new-type').innerHTML =
                wordTypes.map(t => `<option>${t}</option>`).join('');
        }

        // ─── Einstellungen ────────────────────────────────────────────────────────
        function setSpeed(mode) {
            speedMode = mode;
            ['slow','medium','fast'].forEach(m =>
                document.getElementById(`btn-${m}`).classList.toggle('active', m === mode)
            );
        }

        function setGameGoal(goal) {
            gameGoal = goal;
            ['words','time'].forEach(g =>
                document.getElementById(`btn-${g}`).classList.toggle('active', g === goal)
            );
        }

        // ─── Shop ─────────────────────────────────────────────────────────────────
        function renderShop() {
            document.getElementById('shop-grid').innerHTML = shopEmojis.map(emoji => {
                const bought = boughtEmojis.includes(emoji);
                return `<div onclick="buyEmoji('${emoji}')" class="aspect-square flex items-center justify-center rounded-2xl cursor-pointer border-4 transition-all active:scale-90 ${bought ? 'bg-green-50 border-green-300' : 'bg-slate-50 border-slate-100 opacity-40 grayscale'}"><span class="text-2xl">${emoji}</span></div>`;
            }).join('');
        }

        function buyEmoji(emoji) {
            if (boughtEmojis.includes(emoji)) return;
            if (totalCoins >= 20) {
                totalCoins -= 20;
                boughtEmojis.push(emoji);
                saveState();
                renderShop();
                renderBackgroundEmojis();
                document.getElementById('total-coins').innerText = totalCoins;
            }
        }

        function renderBackgroundEmojis() {
            document.getElementById('background-emojis').innerHTML =
                boughtEmojis.map(e => `<div class="bg-emoji">${e}</div>`).join('');
        }

        // ─── Filter ───────────────────────────────────────────────────────────────
        // FIX: Kategorien ohne Wörter werden als deaktiviert angezeigt (aber nicht versteckt)
        function renderFilter() {
            document.getElementById('filter-options').innerHTML = wordTypes.map(t => {
                const hasWords = customWords.some(w => w.type === t);
                return `
                    <label class="flex items-center space-x-2 p-2 bg-white border-2 border-slate-100 rounded-xl cursor-pointer ${hasWords ? '' : 'type-label-disabled'}">
                        <input type="checkbox" ${hasWords ? 'checked' : ''} ${hasWords ? '' : 'disabled'} value="${t}" class="type-filter">
                        <span class="font-bold text-slate-700 text-[10px]">${t} ${hasWords ? '' : '(keine Wörter)'}</span>
                    </label>`;
            }).join('');
        }

        // ─── Spiel starten ────────────────────────────────────────────────────────
        function startGame() {
            const checked = Array.from(document.querySelectorAll('.type-filter:checked')).map(cb => cb.value);

            // FIX: Nur Typen verwenden, für die es tatsächlich Wörter gibt
            const selected = checked.filter(t => customWords.some(w => w.type === t));

            // Falls nach dem Filter nichts übrig bleibt → sofort beenden
            if (selected.length === 0) {
                endGameNoWords();
                return;
            }

            selectedTypes = selected;

            document.getElementById('start-menu').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            setupBaskets();

            gameActive    = true;
            sessionCoins  = 0;
            wordsSpawned  = 0;
            combo         = 0;
            activeWords   = [];
            timeLeft      = 60;
            document.getElementById('words-layer').innerHTML = '';
            document.getElementById('stars-layer').innerHTML = '';

            updateGameUI();
            gameLoop();

            const maxOnScreen = speedMode === 'slow' ? 1 : speedMode === 'medium' ? 2 : 3;

            spawnTimer = setInterval(() => {
                if (!gameActive || isPaused) return;

                // FIX: Prüfe ob noch spielbare Wörter vorhanden
                const pool = customWords.filter(w => selectedTypes.includes(w.type));
                if (pool.length === 0) {
                    if (activeWords.length === 0) { endGame(); }
                    return;
                }

                if (gameGoal === 'words' && wordsSpawned >= 20) {
                    if (activeWords.length === 0) endGame();
                    return;
                }
                if (activeWords.length < maxOnScreen) spawnWord();
            }, 800);

            if (gameGoal === 'time') {
                timerInterval = setInterval(() => {
                    if (!isPaused && gameActive) {
                        timeLeft--;
                        updateGameUI();
                        if (timeLeft <= 0) endGame();
                    }
                }, 1000);
            }
        }

        // Zeigt kurz ein "keine Wörter"-Modal und endet das Level
        function endGameNoWords() {
            document.getElementById('start-menu').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            document.getElementById('baskets-container').innerHTML = '';
            document.getElementById('words-layer').innerHTML = '';
            sessionCoins = 0;
            document.getElementById('session-coins').innerText = 0;
            document.getElementById('result-modal').classList.remove('hidden');
        }

        // ─── Wort spawnen ─────────────────────────────────────────────────────────
        function spawnWord() {
            const pool = customWords.filter(w => selectedTypes.includes(w.type));
            if (pool.length === 0) return;

            const data = { ...pool[Math.floor(Math.random() * pool.length)], id: Date.now() + Math.random() };
            const el = document.createElement('div');
            el.className = 'word-card';
            el.innerText  = data.word;
            el.draggable  = true;

            el.style.left = Math.random() * (window.innerWidth - 220) + 'px';
            el.style.top  = '-80px';

            el.ondragstart = (e) => {
                e.dataTransfer.setData('application/json', JSON.stringify(data));
                el.style.opacity = "0.5";
            };
            el.ondragend = () => { el.style.opacity = "1"; };

            document.getElementById('words-layer').appendChild(el);

            // FIX: activeWords.push VOR Event-Binding, damit obj sicher gefunden wird
            const wordObj = { id: data.id, el, data, y: -80, isDragging: false };
            activeWords.push(wordObj);
            wordsSpawned++;
            updateGameUI();

            el.ontouchstart = (e) => {
                if (!isPaused) {
                    const obj = activeWords.find(w => w.id === data.id);
                    if (obj) {
                        obj.isDragging = true;
                        curTouch = { data, el, obj };
                    }
                }
            };
            el.ontouchmove = handleTouchMove;
            el.ontouchend  = handleTouchEnd;
        }

        // ─── Spiellogik ───────────────────────────────────────────────────────────
        function processChoice(data, basketType) {
            const basketEl = document.querySelector(`.basket[data-type="${basketType}"]`);
            if (!basketEl) return;

            if (data.type === basketType) {
                sessionCoins++;
                combo++;
                basketEl.classList.remove('bounce');
                void basketEl.offsetWidth;
                basketEl.classList.add('bounce');
                if (combo === 5 && !isRewardMode) startRewardMode();
                removeWord(data.id);
            } else {
                stopRewardMode();
                combo = 0;
                basketEl.classList.add('shake');
                setTimeout(() => basketEl.classList.remove('shake'), 500);
                showError(data, basketType);
            }
            updateGameUI();
        }

        function gameLoop() {
            if (!isPaused && gameActive) {
                const limit = window.innerHeight * 0.85;
                const speed = speedMode === 'slow' ? 1.5 : speedMode === 'medium' ? 2.5 : 4;
                for (let i = activeWords.length - 1; i >= 0; i--) {
                    const obj = activeWords[i];
                    if (!obj.isDragging) {
                        obj.y += speed;
                        obj.el.style.top = obj.y + 'px';
                        if (obj.y > limit) {
                            stopRewardMode();
                            combo = 0;
                            updateGameUI();
                            obj.el.remove();
                            activeWords.splice(i, 1);
                        }
                    }
                }
            }
            if (gameActive) requestAnimationFrame(gameLoop);
        }

        function setupBaskets() {
            document.getElementById('baskets-container').innerHTML = selectedTypes.map(t => `
                <div class="basket ${typeColors[t]} flex-1 h-full rounded-t-[2.5rem] border-t-8" data-type="${t}"
                     ondragover="event.preventDefault(); this.classList.add('drag-over')"
                     ondragleave="this.classList.remove('drag-over')"
                     ondrop="handleDrop(event, '${t}')">
                    <span class="p-2 text-xs">${t}</span>
                </div>
            `).join('');
        }

        function handleDrop(e, bt) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            try {
                processChoice(JSON.parse(e.dataTransfer.getData('application/json')), bt);
            } catch(_) {}
        }

        // ─── Reward-Mode ──────────────────────────────────────────────────────────
        function startRewardMode() {
            isRewardMode = true;
            document.getElementById('body-main').classList.add('reward-mode');
            rewardTimer = setInterval(() => {
                if (!isRewardMode || !gameActive || isPaused) return;
                const s = document.createElement('div');
                s.className = 'star';
                s.innerHTML  = '⭐';
                s.style.left = Math.random() * 85 + 'vw';
                s.style.top  = '-80px';
                s.style.transition = "top 4s linear, opacity 0.5s";
                document.getElementById('stars-layer').appendChild(s);
                setTimeout(() => { s.style.top = "105vh"; }, 50);
                const collect = (e) => {
                    e.preventDefault();
                    sessionCoins += 2;
                    updateGameUI();
                    s.style.transform = 'scale(2)';
                    s.style.opacity   = '0';
                    setTimeout(() => s.remove(), 200);
                };
                s.onmousedown  = collect;
                s.ontouchstart = collect;
                setTimeout(() => { if (s.parentNode) s.remove(); }, 4000);
            }, 750);
        }

        function stopRewardMode() {
            isRewardMode = false;
            clearInterval(rewardTimer);
            document.getElementById('body-main').classList.remove('reward-mode');
        }

        function toggleAdmin(show) {
            document.getElementById('admin-panel').classList.toggle('hidden', !show);
        }

        function saveState() {
            localStorage.setItem('w_coins',      totalCoins);
            localStorage.setItem('w_emojis',     JSON.stringify(boughtEmojis));
            localStorage.setItem('w_words_v12',  JSON.stringify(customWords));
        }

        function importBulkList() {
            const input = document.getElementById('bulk-input').value.trim();
            if (!input) return;

            const lines = input.split('\n');
            let added = 0;

            lines.forEach(line => {
                const p = line.trim().split('/');
                if (p.length === 3) {
                    const word      = p[0].trim();
                    const base      = p[1].trim();
                    const typeInput = p[2].trim();
                    const matched   = wordTypes.find(t => t.toLowerCase() === typeInput.toLowerCase());
                    if (word && base && matched) {
                        // Nur hinzufügen wenn kein Duplikat
                        const isDupe = customWords.some(x => x.word === word && x.type === matched);
                        if (!isDupe) {
                            customWords.push({ word, base, type: matched });
                            added++;
                        }
                    }
                }
            });

            if (added > 0) {
                saveState();
                renderAdminTable();
                renderFilter(); // Filter-Checkboxen aktualisieren
                document.getElementById('bulk-input').value = '';
            } else {
                alert('Format: Wort/Grundform/Wortart\nBeispiel: Häuser/Haus/Nomen\n\nKeine neuen (nicht doppelten) Wörter gefunden.');
            }
        }

        function addCustomWord() {
            const w = document.getElementById('new-word').value.trim();
            const b = document.getElementById('new-base').value.trim();
            const t = document.getElementById('new-type').value;
            if (w && b) {
                const isDupe = customWords.some(x => x.word === w && x.type === t);
                if (!isDupe) {
                    customWords.push({ word: w, base: b, type: t });
                    saveState();
                    renderAdminTable();
                    renderFilter();
                }
                document.getElementById('new-word').value = '';
                document.getElementById('new-base').value = '';
            }
        }

        function renderAdminTable() {
            document.getElementById('word-list-table').innerHTML = customWords.map((w, i) => `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-3 font-bold">${w.word}</td>
                    <td class="p-3 italic text-slate-400">${w.base}</td>
                    <td class="p-3">
                        <span class="px-2 py-1 rounded-lg text-[10px] font-black text-white ${typeColors[w.type].split(' ')[0]}">
                            ${w.type}
                        </span>
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="deleteWord(${i})" class="text-slate-300 hover:text-red-500 transition-colors">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function deleteWord(i) {
            customWords.splice(i, 1);
            saveState();
            renderAdminTable();
            renderFilter();
        }

        // ─── Navigation ───────────────────────────────────────────────────────────
        function goHome() {
            gameActive = false;
            isPaused   = false;
            stopRewardMode();
            clearInterval(spawnTimer);
            clearInterval(timerInterval);
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('feedback-modal').classList.add('hidden');
            document.getElementById('start-menu').classList.remove('hidden');
            document.getElementById('total-coins').innerText = totalCoins;
            renderFilter(); // Filter nach Rückkehr neu rendern (falls Wörter geändert)
        }

        // ─── UI Updates ───────────────────────────────────────────────────────────
        function updateGameUI() {
            document.getElementById('game-coins-display').innerText = sessionCoins;
            if (gameGoal === 'words') {
                document.getElementById('counter-display').innerText = wordsSpawned;
                document.getElementById('goal-label').innerText = '/20 Wörter';
            } else {
                document.getElementById('counter-display').innerText = timeLeft;
                document.getElementById('goal-label').innerText = ' Sek.';
            }
            const c = document.getElementById('combo-container');
            if (combo >= 2) {
                c.classList.remove('hidden');
                document.getElementById('combo-count').innerText = combo;
            } else {
                c.classList.add('hidden');
            }
        }

        function showError(data, clicked) {
            isPaused = true;
            document.getElementById('error-text').innerHTML =
                `<b>"${data.word}"</b> ist ein ${data.type}, kein ${clicked}.`;
            document.getElementById('base-display').innerText = data.base;
            document.getElementById('feedback-modal').classList.remove('hidden');
        }

        function resumeGame() {
            document.getElementById('feedback-modal').classList.add('hidden');
            activeWords.forEach(w => w.el.remove());
            activeWords = [];
            isPaused = false;
        }

        function removeWord(id) {
            const i = activeWords.findIndex(w => w.id === id);
            if (i > -1) { activeWords[i].el.remove(); activeWords.splice(i, 1); }
        }

        function endGame() {
            gameActive = false;
            clearInterval(spawnTimer);
            clearInterval(timerInterval);
            stopRewardMode();
            totalCoins += sessionCoins;
            document.getElementById('session-coins').innerText = sessionCoins;
            document.getElementById('result-modal').classList.remove('hidden');
            saveState();
        }

        // ─── Touch Handling ───────────────────────────────────────────────────────
        function handleTouchMove(e) {
            if (!curTouch || isPaused) return;
            e.preventDefault();
            const t = e.touches[0];
            curTouch.el.style.left = (t.clientX - 100) + 'px';
            curTouch.el.style.top  = (t.clientY - 40)  + 'px';
            if (curTouch.obj) curTouch.obj.y = t.clientY - 40;
            document.querySelectorAll('.basket').forEach(b => {
                const r = b.getBoundingClientRect();
                if (t.clientX > r.left && t.clientX < r.right && t.clientY > r.top) {
                    b.classList.add('drag-over');
                } else {
                    b.classList.remove('drag-over');
                }
            });
        }

        function handleTouchEnd(e) {
            if (!curTouch) return;
            const t = e.changedTouches[0];
            document.querySelectorAll('.basket').forEach(b => {
                b.classList.remove('drag-over');
                const r = b.getBoundingClientRect();
                if (t.clientX > r.left && t.clientX < r.right && t.clientY > r.top) {
                    processChoice(curTouch.data, b.dataset.type);
                }
            });
            if (curTouch.obj) curTouch.obj.isDragging = false;
            curTouch = null;
        }
